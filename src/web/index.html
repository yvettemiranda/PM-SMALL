<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Polymarket低价合约机器人</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">PAPER ONLY</p>
          <h1>低价合约自动挂单机器人</h1>
          <p class="subtitle">第一阶段仅使用真实公开行情和虚拟资金</p>
        </div>
        <div id="system-state" class="badge">正在读取</div>
      </header>

      <section class="stats" id="stats"></section>

      <section class="panel controls">
        <div>
          <h2>测试策略</h2>
          <p>实盘执行器固定禁用，不读取钱包或交易凭证。</p>
        </div>
        <div class="actions">
          <button data-action="start">启动</button>
          <button data-action="pause" class="secondary">暂停</button>
          <button data-action="stop" class="danger">停止</button>
          <button id="refresh" class="secondary">刷新候选</button>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>候选Token</h2>
            <p id="scan-meta">尚未完成扫描</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>事件／市场</th>
                <th>方向</th>
                <th>进度</th>
                <th>最优买价</th>
                <th>Maker买价</th>
                <th>固定卖价</th>
                <th>份数</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="candidates"></tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>测试订单</h2>
            <p>成交采用挂单前方队列抵扣模型。</p>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Token</th>
                <th>方向</th>
                <th>价格</th>
                <th>数量</th>
                <th>已成交</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="orders"></tbody>
          </table>
        </div>
      </section>

      <p id="message" role="status"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
