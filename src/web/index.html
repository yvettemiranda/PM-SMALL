<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PM-SMALL TEST</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <h1 class="sr-only">PM-SMALL TEST</h1>

      <header class="topbar">
        <div class="mode-switch" role="group" aria-label="交易模式">
          <button id="test-mode" type="button" aria-pressed="true">TEST</button>
          <button id="live-mode" type="button" aria-pressed="false">LIVE</button>
        </div>
        <div class="topbar-actions">
          <button id="run-toggle" class="button primary" type="button">开始TEST</button>
          <button
            id="config-toggle"
            class="button secondary"
            type="button"
            aria-expanded="false"
            aria-controls="config-panel"
          >
            配置
          </button>
        </div>
      </header>

      <p id="live-lock" class="inline-note" hidden>
        LIVE 尚未开放；纸面闭环和长期 TEST 验证完成前不能启用。
      </p>

      <section id="config-panel" class="config-panel" hidden>
        <form id="config-form">
          <div class="section-heading config-heading">
            <div>
              <span class="eyebrow">SETUP</span>
              <h2>交易配置</h2>
            </div>
            <button id="config-close" class="icon-button" type="button" aria-label="关闭配置">×</button>
          </div>

          <div class="config-grid">
            <fieldset class="config-block category-block">
              <legend>市场类别</legend>
              <label class="all-category-option">
                <input id="all-categories" type="checkbox" />
                <span>全选</span>
              </label>
              <div id="category-options" class="chip-options" aria-label="选择市场类别"></div>
              <p id="category-note" class="field-note">栏目与 Polymarket 首页同步；全选时会自动纳入新栏目。</p>
            </fieldset>

            <fieldset class="config-block">
              <legend>市场类型</legend>
              <div class="check-options">
                <label><input id="binary-market" type="checkbox" value="BINARY" /><span>二元市场</span></label>
                <label><input id="ternary-market" type="checkbox" value="TERNARY" /><span>三元市场</span></label>
                <label><input id="multi-market" type="checkbox" value="MULTI" /><span>多元市场（4+）</span></label>
              </div>
            </fieldset>

            <label class="field config-block">
              <span>买入价范围</span>
              <span class="price-input">
                <span>1–</span>
                <input
                  id="max-buy-price"
                  type="number"
                  min="1"
                  max="3"
                  step="1"
                  inputmode="numeric"
                  aria-label="最高买入价（美分）"
                />
                <span>¢</span>
              </span>
            </label>

            <div class="range-fields config-block">
              <div class="duration-field range-field">
                <div class="range-heading">
                  <span>市场总时长</span>
                  <strong><span id="min-duration-value">1</span>–<span id="max-duration-value">30</span>天</strong>
                </div>
                <div class="duration-inputs">
                  <label class="duration-bound">
                    <span>最短</span>
                    <span class="unit-input">
                      <input id="min-market-duration" type="number" min="1" max="365" step="1" value="1" inputmode="numeric" />
                      <span>天</span>
                    </span>
                  </label>
                  <span class="duration-separator" aria-hidden="true">至</span>
                  <label class="duration-bound">
                    <span>最长</span>
                    <span class="unit-input">
                      <input id="max-market-duration" type="number" min="1" max="365" step="1" value="30" inputmode="numeric" />
                      <span>天</span>
                    </span>
                  </label>
                </div>
              </div>
              <div class="range-field">
                <div class="range-heading">
                  <span>最低买卖盘比例</span>
                  <strong>≥<span id="bid-ask-ratio-value">50</span>%</strong>
                </div>
                <input
                  id="bid-ask-ratio"
                  type="range"
                  min="1"
                  max="100"
                  step="1"
                  value="50"
                  aria-label="最低买卖盘比例"
                  aria-valuetext="至少50%"
                />
              </div>
              <div class="range-field">
                <div class="range-heading">
                  <span>生命周期进度</span>
                  <strong>≤<span id="market-progress-value">20</span>%</strong>
                </div>
                <input
                  id="market-progress-filter"
                  type="range"
                  min="1"
                  max="100"
                  step="1"
                  value="20"
                  aria-label="允许买入的最大生命周期进度"
                  aria-valuetext="不超过20%"
                />
              </div>
            </div>

            <div class="test-settings config-block">
              <div class="subsection-heading">
                <span>TEST 设置</span>
                <small>仅影响模拟账户</small>
              </div>
              <div class="money-fields">
                <label class="field">
                  <span>总模拟资金</span>
                  <span class="unit-input">
                    <input id="initial-capital" type="number" min="0.01" step="0.01" inputmode="decimal" />
                    <span>U</span>
                  </span>
                </label>
                <label class="field">
                  <span>每 Event 每轮金额</span>
                  <span class="unit-input">
                    <input id="order-amount" type="number" min="0.01" step="0.01" inputmode="decimal" />
                    <span>U</span>
                  </span>
                </label>
              </div>
              <p class="field-note">首次成交时冻结为该 Event 本轮的累计现金投入上限；买入费用从实际获得份额中扣除。</p>
              <button id="reset-test" class="button danger" type="button">重置TEST</button>
            </div>
          </div>

          <div class="config-actions">
            <button id="save-config" class="button primary save-config" type="submit">保存配置</button>
          </div>
        </form>
      </section>

      <section id="portfolio" class="portfolio" aria-label="资金与持仓">
        <article><span>总资金</span><strong id="total-funds">—</strong></article>
        <article><span>持仓实时价值</span><strong id="position-value">—</strong></article>
        <article><span>持仓数</span><strong id="portfolio-position-count">—</strong></article>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <span class="eyebrow">PORTFOLIO</span>
            <h2>当前持仓</h2>
          </div>
          <span id="position-count" class="count">0个</span>
        </div>
        <div id="positions" class="position-list" aria-live="polite"></div>
        <div id="position-list-controls" class="load-more position-list-controls" hidden>
          <button id="toggle-positions" class="button secondary compact-button" type="button">展开其余持仓</button>
          <span id="position-display-count" class="count">当前显示0 / 0</span>
        </div>
      </section>

      <section class="panel">
        <div class="section-heading scan-heading">
          <div class="scan-title">
            <span class="eyebrow">DISCOVERY</span>
            <div class="heading-line">
              <h2>扫描事件</h2>
              <span id="candidate-count" class="count">0个</span>
            </div>
            <span id="scan-refresh-state" class="scan-state" role="status" aria-live="polite">等待首次扫描</span>
          </div>
          <button
            id="sort-toggle"
            class="sort-toggle"
            type="button"
            data-sort-toggle
            aria-label="当前按市场进度正序，点击切换为倒序"
          ><span>进度</span><strong aria-hidden="true">↑</strong></button>
        </div>

        <div id="candidates" class="market-list" aria-live="polite"></div>

        <div class="load-more">
          <button id="load-more" class="button secondary" type="button">再显示20个</button>
          <span id="display-count" class="count">当前显示0 / 0</span>
        </div>
      </section>

      <p id="message" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
